name: Validate content-team
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release checks (version, agents, skills, settings, safety check tests)
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code validation of the agents and skills (through the eval build)
        run: |
          scripts/build-eval-plugin.sh
          npx -y @anthropic-ai/claude-code plugin validate --strict .build/content-team
